name: advanced_device_info
description: "Advanced device, hardware, security, anti-fraud, thermal, DRM, biometrics, sensors, and live system information for Flutter on Android & iOS."
version: 0.0.2
homepage: https://github.com/naitikharkhani7/advanced_device_info
repository: https://github.com/naitikharkhani7/advanced_device_info
issue_tracker: https://github.com/naitikharkhani7/advanced_device_info/issues
topics:
  - device-info
  - security
  - anti-fraud
  - hardware
  - system-info

screenshots:
  - description: 'Device Intelligence & Security Dashboard'
    path: screenshots/dashboard.png
  - description: 'Physical RAM & Storage Metrics'
    path: screenshots/storage.png
  - description: 'Real-time System Memory Diagnostics'
    path: screenshots/memory.png

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  
flutter:

  plugin:
    platforms:
      android:
        package: com.naitikharkhani.advanced_device_info
        pluginClass: AdvancedDeviceInfoPlugin
      ios:
        pluginClass: AdvancedDeviceInfoPlugin
