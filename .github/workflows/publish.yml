name: Release & Publish to pub.dev

on:
  push:
    branches:
      - publish_pub_dev
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Custom version to set (e.g. 1.0.0). Leave blank to auto-calculate.'
        required: false
        default: ''
      bump_type:
        description: 'Auto-bump type (when code version <= live version)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

concurrency:
  group: publish-release
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  version_and_tag:
    runs-on: ubuntu-latest
    outputs:
      target_version: ${{ steps.manage_version.outputs.target_version }}
      version_changed: ${{ steps.manage_version.outputs.version_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Calculate and Update Version
        id: manage_version
        run: |
          dart run tool/manage_version.dart \
            --custom-version="${{ github.event.inputs.custom_version }}" \
            --bump-type="${{ github.event.inputs.bump_type || 'patch' }}"

      - name: Commit and Push Version Update to Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are uncommitted changes
          if [ -n "$(git status --porcelain)" ]; then
            git add pubspec.yaml CHANGELOG.md
            git commit -m "chore(release): bump version to $TARGET_VERSION [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Successfully committed and pushed updated files to ${{ github.ref_name }}."
          else
            echo "No version changes were required to commit."
          fi

      - name: Create and Push Release Tag
        run: |
          TAG_NAME="v$TARGET_VERSION"
          echo "Target Release Tag: $TAG_NAME"
          
          # Remove local tag if it already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Removing existing local tag $TAG_NAME"
            git tag -d "$TAG_NAME"
          fi
          
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME" --force

  publish:
    needs: version_and_tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for pub.dev OIDC authentication
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run verification (dry-run)
        run: flutter pub publish --dry-run
        continue-on-error: true

      - name: Publish to pub.dev
        timeout-minutes: 5
        run: dart pub publish --force
